<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Twibbon Maker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Twibbon Maker</h1>

  <p class="warning">📌 Geser dan zoom untuk menyesuaikan foto agar pas dengan bingkai.</p>

  <input type="file" id="upload" accept="image/*" />
  
  <div class="canvas-container">
    <canvas id="canvas" width="800" height="800"></canvas>
  </div>

  <div class="controls">
    <label>Zoom: <input type="range" id="zoom" min="1" max="3" step="0.01" value="1" /></label>
    <button id="download">Unduh Hasil</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
