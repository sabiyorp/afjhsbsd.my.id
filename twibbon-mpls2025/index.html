<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twibbon MPLS 2025</title>
  <link rel="icon" href="https://afjhsbsd.my.id/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root {
      --primary: #1976d2;
      --primary-dark: #1565c0;
      --danger: #e02121;
      --danger-dark: #c01818;
      --bg-gradient: linear-gradient(135deg, #e3f2fd 0%, #ffffff 100%);
      --shadow: 0 6px 24px 0 rgba(25, 118, 210, 0.10), 0 1.5px 8px 0 rgba(25, 118, 210, 0.07);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Montserrat", sans-serif;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      color: #222;
      min-height: 100vh;
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: 160px;
      height: auto;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.8rem;
      margin: 0 0 16px;
      color: var(--primary);
      font-weight: 700;
      text-align: center;
    }

    input[type="file"] {
      font-size: 1rem;
      border: 2px dashed var(--primary);
      border-radius: 14px;
      padding: 20px;
      margin: 10px 0;
      width: 100%;
      cursor: pointer;
      background: #e3efff;
    }

    .border {
      border: 1.5px solid var(--primary);
      border-radius: 14px;
      width: 100%;
      margin-top: 12px;
      padding: 10px;
    }

    .warning,
    .hint-touch {
      display: flex;
      align-items: center;
      font-size: 0.95rem;
      gap: 6px;
      color: var(--primary);
      font-weight: 500;
    }

    .hint-touch {
      display: none;
      margin-top: 6px;
    }

    @media (pointer: coarse) {
      .hint-touch {
        display: flex;
      }
    }

    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 340px;
      aspect-ratio: 1 / 1;
      margin-top: 16px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 2px solid #bbdefb;
      background: #f5f5f5;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls {
      margin-top: 20px;
      width: 100%;
    }

    .zoom-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    label {
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
      color: #333;
      text-align: left;
    }

    .zoom-slider {
      flex: 1;
      accent-color: var(--primary);
      height: 4px;
    }

    .zoom-value {
      font-weight: 600;
      font-size: 1rem;
      color: var(--primary);
      min-width: 50px;
      text-align: right;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 28px;
      width: 100%;
    }

    #download {
      background: var(--primary);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 16px 0;
      border: none;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #reset {
      background: var(--danger);
      color: white;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 10px 0;
      border: none;
      border-radius: 10px;
      width: 60%;
      margin: 0 auto 100px auto;
      cursor: pointer;
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 24;
      font-size: 20px;
      vertical-align: middle;
    }

    @media (max-width: 480px) {
      .card {
        padding: 18px 14px;
      }

      h1 {
        font-size: 1.5rem;
      }

      .zoom-value {
        font-size: 1rem;
      }

      #download {
        font-size: 1.1rem;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <img src="logo.png" alt="Logo" class="logo" />
    <h1>Twibbon MPLS 2025</h1>
    <input type="file" id="upload" accept="image/*" />
    <div class="border">
      <div class="warning">
        <span class="material-symbols-outlined">info</span>
        <span>Geser dan zoom foto ke dalam bingkai.</span>
      </div>
      <div class="hint-touch">
        <span class="material-symbols-outlined">touch_app</span>
        Cubit untuk zoom, seret untuk geser.
      </div>
    </div>
    <div class="canvas-container">
      <canvas id="canvas" width="1080" height="1080"></canvas>
    </div>
    <div class="controls">
      <label for="zoom">Zoom Foto</label>
      <div class="zoom-row">
        <input type="range" id="zoom" min="0.2" max="3" step="0.01" value="1.2" class="zoom-slider" />
        <span class="zoom-value" id="zoomValue">1.00</span>
      </div>
      <div class="button-group">
        <button id="download"><span class="material-symbols-outlined">download</span>Unduh Hasil</button>
        <button id="reset"><span class="material-symbols-outlined">restart_alt</span>Atur Ulang</button>
      </div>
    </div>
  </div>
  <script>
    const upload = document.getElementById('upload');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const zoomSlider = document.getElementById('zoom');
    const zoomValueLabel = document.getElementById('zoomValue');
    const downloadBtn = document.getElementById('download');
    const resetBtn = document.getElementById('reset');
    const hintTouch = document.getElementById('hintTouch');
    const canvasWrapper = document.getElementById('canvasWrapper');

    let userImage = null;
    const frameImage = new Image();
    frameImage.src = 'frame.png';

    const baseScale = 1.2;
    let scale = baseScale;
    let offsetX = 0;
    let offsetY = 0;
    let dragging = false;
    let startX, startY;

    // Pinch-to-zoom
    let lastTouchDist = null;
    let lastMid = null;

    function getTouchDist(e) {
      if (e.touches.length < 2) return null;
      const [t1, t2] = e.touches;
      const dx = t1.clientX - t2.clientX;
      const dy = t1.clientY - t2.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }
    function getTouchMid(e, rect) {
      if (e.touches.length < 2) return null;
      const [t1, t2] = e.touches;
      return {
        x: ((t1.clientX + t2.clientX) / 2) - rect.left,
        y: ((t1.clientY + t2.clientY) / 2) - rect.top
      };
    }

    upload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const tempImg = new Image();
        tempImg.onload = () => {
          const maxWidth = 1280, maxHeight = 1280;
          let { width, height } = tempImg;
          const aspectRatio = width / height;
          // SELALU resize ke max 1280 pada sisi terpanjang
          if (aspectRatio > 1) {
            width = 1280;
            height = Math.round(1280 / aspectRatio);
          } else {
            height = 1280;
            width = Math.round(1280 * aspectRatio);
          }
          const offCanvas = document.createElement('canvas');
          offCanvas.width = width; offCanvas.height = height;
          const offCtx = offCanvas.getContext('2d');
          offCtx.drawImage(tempImg, 0, 0, width, height);
          userImage = new Image();
          userImage.onload = () => {
            scale = baseScale;
            offsetX = 0;
            offsetY = 0;
            zoomSlider.value = scale;
            zoomValueLabel.textContent = (scale / baseScale).toFixed(2);
            draw();
          };
          userImage.src = offCanvas.toDataURL('image/jpeg', 0.9);
        };
        tempImg.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    zoomSlider.addEventListener('input', () => {
      scale = parseFloat(zoomSlider.value);
      zoomValueLabel.textContent = (scale / baseScale).toFixed(2);
      draw();
    });

    // Drag/Move mouse
    canvas.addEventListener('mousedown', (e) => {
      dragging = true;
      startX = e.offsetX;
      startY = e.offsetY;
    });
    canvas.addEventListener('mousemove', (e) => {
      if (dragging) {
        offsetX += e.offsetX - startX;
        offsetY += e.offsetY - startY;
        startX = e.offsetX;
        startY = e.offsetY;
        draw();
      }
    });
    canvas.addEventListener('mouseup', () => dragging = false);
    canvas.addEventListener('mouseleave', () => dragging = false);

    // Touch events: move and pinch
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        dragging = true;
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        startX = touch.clientX - rect.left;
        startY = touch.clientY - rect.top;
      } else if (e.touches.length === 2) {
        dragging = false;
        lastTouchDist = getTouchDist(e);
        lastMid = getTouchMid(e, canvas.getBoundingClientRect());
      }
    });
    canvas.addEventListener('touchmove', (e) => {
      const rect = canvas.getBoundingClientRect();
      if (e.touches.length === 1 && dragging) {
        const touch = e.touches[0];
        const x = touch.clientX - rect.left;
        const y = touch.clientY - rect.top;
        offsetX += x - startX;
        offsetY += y - startY;
        startX = x;
        startY = y;
        draw();
      } else if (e.touches.length === 2) {
        // Pinch zoom
        const dist = getTouchDist(e);
        if (lastTouchDist && dist) {
          const scaleChange = dist / lastTouchDist;
          const prevScale = scale;
          scale = Math.max(0.2, Math.min(3, scale * scaleChange));
          zoomSlider.value = scale;
          zoomValueLabel.textContent = (scale / baseScale).toFixed(2);

          // Zoom center on pinch mid-point
          const mid = getTouchMid(e, rect);
          if (mid && lastMid) {
            const dx = mid.x - lastMid.x;
            const dy = mid.y - lastMid.y;
            offsetX += dx;
            offsetY += dy;

            // Adjust offset so that zoom is centered under the pinch
            const scaleDelta = scale / prevScale;
            offsetX = (offsetX - mid.x) * scaleDelta + mid.x;
            offsetY = (offsetY - mid.y) * scaleDelta + mid.y;
          }
          draw();
        }
        lastTouchDist = dist;
        lastMid = getTouchMid(e, rect);
      }
      e.preventDefault();
    }, { passive: false });
    canvas.addEventListener('touchend', (e) => {
      dragging = false;
      if (e.touches.length < 2) {
        lastTouchDist = null;
        lastMid = null;
      }
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (userImage) {
        const iw = userImage.width * scale;
        const ih = userImage.height * scale;
        const ix = (canvas.width - iw) / 2 + offsetX;
        const iy = (canvas.height - ih) / 2 + offsetY;
        ctx.drawImage(userImage, ix, iy, iw, ih);
      }
      if (frameImage.complete) {
        ctx.drawImage(frameImage, 0, 0, canvas.width, canvas.height);
      }
    }

    downloadBtn.addEventListener('click', () => {
      if (!userImage || !frameImage.complete) {
        alert("Pastikan foto dan frame sudah dimuat.");
        return;
      }
      draw();
      setTimeout(() => {
        const link = document.createElement('a');
        link.download = 'twibbon.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      }, 120);
    });

    resetBtn.addEventListener('click', () => {
      if (!confirm("Apakah Anda yakin ingin mereset? Semua perubahan foto akan hilang.")) {
        return;
      }
      userImage = null;
      scale = baseScale;
      offsetX = 0;
      offsetY = 0;
      zoomSlider.value = scale;
      zoomValueLabel.textContent = (scale / baseScale).toFixed(2);
      upload.value = "";
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (frameImage.complete) {
        ctx.drawImage(frameImage, 0, 0, canvas.width, canvas.height);
      }
    });

    frameImage.onload = () => draw();
    // Show pinch hint only on touch devices
    if ('ontouchstart' in window) {
      hintTouch.style.display = 'flex';
    }
  </script>

</body>

</html>
