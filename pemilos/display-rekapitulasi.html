<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DISPLAY</title>

<!-- Import Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background-color: #0d0f14;
    font-family: "Barlow Semi Condensed", sans-serif;
    font-weight: 700;
    color: white;
    overflow: hidden;
  }

  .wrapper {
    display: flex;
    height: 100vh;
  }

  .column {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    text-align: center;
  }

  .column:nth-child(1) { background-color: #a31217; }   /* Merah */
  .column:nth-child(2) { background-color: #ff8a00; }   /* Oranye */
  .column:nth-child(3) { background-color: #2eac2b; }   /* Hijau */
  .column:nth-child(4) { background-color: #1a40ce; }   /* Biru */
  .column:nth-child(5) { background-color: #9e9e9e; }   /* Abu-abu Abstain */

  /* Nomor urut di atas */
  .top-number {
    font-size: 120px;
    font-weight: 700;
    text-shadow: 0 0 20px rgba(255,255,255,0.9);
    line-height: 1;
    margin-top: 20px;
  }

  /* Area tengah (angka + teks Suara) */
  .center-area {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
  }

  .count {
    font-size: 72px;
    font-weight: 700;
    text-shadow: 0 0 15px rgba(255,255,255,0.9);
  }

  .suara-text {
    font-size: 28px;
    font-weight: 700;
    text-shadow: 0 0 10px rgba(255,255,255,0.9);
  }

  /* Foto fix di bawah */
  .photo {
    position: absolute;
    bottom: 0;
    width: 100%;
  }

  .photo img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
    border-radius: 0;
  }

  /* Kolom Abstain */
  .column.abstain .top-number {
    font-size: clamp(40px, 5vw, 60px); /* Responsif */
    margin-top: 30px;
  }
</style>
</head>
<body>

<div class="wrapper">
  <div class="column" data-id="1">
    <div class="top-number">1</div>
    <div class="center-area">
      <div class="count">0</div>
      <div class="suara-text">Suara</div>
    </div>
    <div class="photo"><img src="foto1.png" alt="Paslon 1"></div>
  </div>

  <div class="column" data-id="2">
    <div class="top-number">2</div>
    <div class="center-area">
      <div class="count">0</div>
      <div class="suara-text">Suara</div>
    </div>
    <div class="photo"><img src="foto2.png" alt="Paslon 2"></div>
  </div>

  <div class="column" data-id="3">
    <div class="top-number">3</div>
    <div class="center-area">
      <div class="count">0</div>
      <div class="suara-text">Suara</div>
    </div>
    <div class="photo"><img src="foto3.png" alt="Paslon 3"></div>
  </div>

  <div class="column active" data-id="4">
    <div class="top-number">4</div>
    <div class="center-area">
      <div class="count">0</div>
      <div class="suara-text">Suara</div>
    </div>
    <div class="photo"><img src="foto4.png" alt="Paslon 4"></div>
  </div>

  <div class="column abstain" data-id="5">
    <div class="top-number">Abstain</div>
    <div class="center-area">
      <div class="count">0</div>
      <div class="suara-text">Suara</div>
    </div>
    <div class="photo"><img src="foto5.png" alt="Abstain"></div>
  </div>
</div>

<script>
  function updateDisplay() {
    document.querySelectorAll('.column').forEach(col => {
      const id = col.dataset.id;
      const countEl = col.querySelector('.count');
      const value = localStorage.getItem(`paslon${id}`) || 0;
      countEl.textContent = value;
    });
  }

  updateDisplay();
  setInterval(updateDisplay, 500);
</script>

</body>
</html>
