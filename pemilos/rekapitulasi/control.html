<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔴 CONTROL</title>
  <link rel="icon" type="image/x-icon" href="img/png/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Barlow Semi Condensed", sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #111;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      border: 2px solid #ccc;
      padding: 8px 12px;
      border-radius: 10px;
      background: #fff;
    }

    .toolbar button {
      border: none;
      background: none;
      font-size: 26px;
      cursor: pointer;
      color: #333;
      transition: all 0.2s ease;
      border-radius: 8px;
      padding: 4px 10px;
    }

    .toolbar button:hover {
      background: #ddd;
      color: #000;
      transform: scale(1.05);
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .card {
      border: none;
      padding: 15px;
      width: 240px;
      border-radius: 15px;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
    }

    .card:active {
      transform: scale(0.97);
      filter: brightness(0.9);
    }

    .title {
      color: #fff;
      font-weight: bold;
      font-size: 20px;
      margin-bottom: 10px;
      padding: 5px;
    }

    .picture {
      width: 100%;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .picture img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .buttons {
      margin-top: 10px;
    }

    button.plus,
    button.minus {
      border: 1px solid #000;
      background: #fff;
      color: #000;
      font-size: 18px;
      margin: 5px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button.plus:hover,
    button.minus:hover {
      background: #e0e0e0;
      transform: scale(1.05);
    }

    .number {
      font-weight: bold;
      font-size: 20px;
      width: 60px;
      text-align: center;
    }

    .info {
      margin-top: 8px;
      font-size: 14px;
      color: white;
    }

    .card[data-id="1"] { background-color: #8B0000; }
    .card[data-id="2"] { background-color: #FF8C00; }
    .card[data-id="3"] { background-color: #006400; }
    .card[data-id="4"] { background-color: #00008B; }
    .card[data-id="5"] { background-color: #333333; }
  </style>
</head>

<body>
  <h1>Control Panel Rekapitulasi Suara OSIS SMP Al-Fath BSD</h1>

  <div class="toolbar">
    <button id="resetAll" title="Hapus Semua Data">🗑️</button>
    <button id="savePdf" title="Simpan ke PDF">💾</button>
  </div>

  <div class="container">
    <div class="card" data-id="1">
      <div class="title">Paslon 1</div>
      <div class="picture"><img src="foto1.png" alt="Paslon 1"></div>
      <div class="buttons">
        <button class="minus">-</button>
        <input type="number" class="number" value="0">
        <button class="plus">+</button>
      </div>
      <div class="info">Ketos: Anezka<br>Waketos: Atifa</div>
    </div>

    <div class="card" data-id="2">
      <div class="title">Paslon 2</div>
      <div class="picture"><img src="foto2.png" alt="Paslon 2"></div>
      <div class="buttons">
        <button class="minus">-</button>
        <input type="number" class="number" value="0">
        <button class="plus">+</button>
      </div>
      <div class="info">Ketos: Karin<br>Waketos: Drupadi</div>
    </div>

    <div class="card" data-id="3">
      <div class="title">Paslon 3</div>
      <div class="picture"><img src="foto3.png" alt="Paslon 3"></div>
      <div class="buttons">
        <button class="minus">-</button>
        <input type="number" class="number" value="0">
        <button class="plus">+</button>
      </div>
      <div class="info">Ketos: Narel<br>Waketos: Najla</div>
    </div>

    <div class="card" data-id="4">
      <div class="title">Paslon 4</div>
      <div class="picture"><img src="foto4.png" alt="Paslon 4"></div>
      <div class="buttons">
        <button class="minus">-</button>
        <input type="number" class="number" value="0">
        <button class="plus">+</button>
      </div>
      <div class="info">Ketos: Raya<br>Waketos: Atharraza</div>
    </div>

    <div class="card" data-id="5">
      <div class="title">Abstain</div>
      <div class="picture"><img src="foto5.png" alt="Abstain"></div>
      <div class="buttons">
        <button class="minus">-</button>
        <input type="number" class="number" value="0">
        <button class="plus">+</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    const { jsPDF } = window.jspdf;
    const cards = document.querySelectorAll('.card');

    cards.forEach(card => {
      const id = card.dataset.id;
      const input = card.querySelector('.number');
      const saved = localStorage.getItem(`paslon${id}`);
      if (saved) input.value = saved;
    });

    cards.forEach(card => {
      const id = card.dataset.id;
      const input = card.querySelector('.number');
      const plus = card.querySelector('.plus');
      const minus = card.querySelector('.minus');

      plus.addEventListener('click', e => {
        e.stopPropagation();
        input.value = parseInt(input.value) + 1;
        localStorage.setItem(`paslon${id}`, input.value);
      });

      minus.addEventListener('click', e => {
        e.stopPropagation();
        input.value = Math.max(0, parseInt(input.value) - 1);
        localStorage.setItem(`paslon${id}`, input.value);
      });

      card.addEventListener('click', e => {
        if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
          input.value = parseInt(input.value) + 1;
          localStorage.setItem(`paslon${id}`, input.value);
        }
      });

      input.addEventListener('input', () => {
        localStorage.setItem(`paslon${id}`, input.value);
      });
    });

    document.getElementById('resetAll').addEventListener('click', () => {
      if (confirm("Yakin ingin menghapus semua data?")) {
        cards.forEach(card => {
          const id = card.dataset.id;
          const input = card.querySelector('.number');
          input.value = 0;
          localStorage.removeItem(`paslon${id}`);
        });
      }
    });

    document.getElementById('savePdf').addEventListener('click', () => {
      const doc = new jsPDF();
      const pageWidth = doc.internal.pageSize.getWidth();
      let y = 30;
      let total = 0;

      doc.setFont("courier", "bold");
      doc.setFontSize(22);
      const title = "HASIL REKAPITULASI PEMILOS 25/26";
      const titleWidth = doc.getTextWidth(title);
      doc.text(title, (pageWidth - titleWidth) / 2, y);
      y += 20;

      doc.setFontSize(16);
      cards.forEach(card => {
        const label = card.querySelector('.title').textContent;
        const number = parseInt(card.querySelector('.number').value);
        total += number;
        const line = `${label}: ${number} suara`;
        const textWidth = doc.getTextWidth(line);
        doc.text(line, (pageWidth - textWidth) / 2, y);
        y += 10;
      });

      y += 15;
      const totalLine = `TOTAL SUARA: ${total}`;
      const totalWidth = doc.getTextWidth(totalLine);
      doc.text(totalLine, (pageWidth - totalWidth) / 2, y);

      doc.save("HASIL_REKAPITULASI_PEMILOS_2526.pdf");
    });
  </script>
</body>
</html>
